# Apply alongside cordis.patch.yml. Point this provider at the accounting relay.
# The deepseek-improver route injects thinking enabled and reasoning_effort high.
- id: llm-pi-ai
  disabled: false
  config:
    providers:
      evokit-improver:
        api: openai-completions
        baseURL: !!js process.env.EVOKIT_IMPROVER_BASE_URL
        apiKeyEnv: EVOKIT_RELAY_CLIENT_TOKEN
        retryPolicy: {mode: normal, maxRetries: 0}
        reasoning: high
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
          thinkingFormat: deepseek
        models:
          - id: deepseek-improver
            contextWindow: 524288
            maxTokens: 32768
            input: [text]
            reasoningEfforts: {high: high}
- id: agent-default-model
  config:
    provider: evokit-improver
    model: deepseek-improver
