- insert:
    - id: evokit-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: evokit
        transport: stdio
        # Defaults: `evokit` from PATH, and the directory where DSH starts.
        command: !!js process.env.EVOKIT_MCP_COMMAND || 'evokit'
        args: [mcp]
        cwd: !!js process.env.EVOKIT_WORKSPACE || process.cwd()
        startupTimeoutMs: 30000
        toolCallTimeoutMs: 300000
        failOnStartupError: true
        reconnect:
          enabled: false
    - id: evokit-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: evokit
        includeDefaultRoots: false
        # Default: this bundle's own skills, installed in the profile directory (ctx.baseUrl).
        customSkillDirs: !!js "[process.env.EVOKIT_SKILL_ROOT || process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-evokit/skills', ctx.baseUrl))]"
        watch: false
