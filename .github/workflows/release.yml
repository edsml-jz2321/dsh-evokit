name: Release artifacts

# Pushing a tag vX.Y.Z builds once, then publishes the same files to PyPI, npm
# and a GitHub Release, and server.json to the official MCP Registry after PyPI.
# Each publish job fails on its own and any failure marks the whole run failed.
# Every publish job can be rerun safely: PyPI skips files that already exist,
# npm skips a version already published with the same tarball, the GitHub
# Release is updated in place, and a version already in the registry is skipped.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.21'
          python-version: '3.12'
      - run: uv sync --frozen --group dev
      - name: Build from tagged source and verify package identity
        run: |
          uv run --frozen python -c "import os,tomllib,json; from pathlib import Path; v=tomllib.loads(Path('pyproject.toml').read_text())['project']['version']; assert os.environ['GITHUB_REF_NAME'] == 'v'+v; assert all(json.loads(Path(p).read_text())['version']==v for p in ['plugin.json','package.json','server.json','integrations/dsh/plugin.json','integrations/dsh/package.json'])"
          uv run --frozen python scripts/release_notes.py "${GITHUB_REF_NAME#v}" > /dev/null
          uv build
          uv run --frozen python scripts/check_package.py
          npm pack ./integrations/dsh --ignore-scripts --pack-destination dist
          uv run --frozen python integrations/dsh/check_package.py "dist/dsh-evokit-${GITHUB_REF_NAME#v}.tgz"
          cd dist
          sha256sum *.whl *.tar.gz *.tgz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    # PyPI Trusted Publishing: no token is stored anywhere. PyPI trusts this
    # workflow file in this repository, running in the `pypi` environment.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dsh-evokit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - name: Keep only the Python distributions
        run: |
          find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -delete
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-npm:
    # npm Trusted Publishing (OIDC): no token and no NODE_AUTH_TOKEN. npm trusts
    # this workflow file in this repository, running in the `npm` environment.
    # Provenance is attached automatically for a public repository and package.
    # No checkout: the tarball's own package.json is the only manifest present.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/dsh-evokit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Use npm 11.5.1 or later (required for trusted publishing)
        run: |
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"; then
            npm install --global npm@11
          fi
          npm --version
      - name: Publish the built DSH bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          tarball="dist/dsh-evokit-${version}.tgz"
          test -f "$tarball"
          cd dist
          sha256sum --check --ignore-missing SHA256SUMS
          cd ..
          local_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          published="$(npm view "dsh-evokit@${version}" dist.integrity 2>/dev/null || true)"
          if [ -n "$published" ]; then
            if [ "$published" = "$local_integrity" ]; then
              echo "dsh-evokit@${version} is already published with this tarball; skipping."
              exit 0
            fi
            echo "::error::dsh-evokit@${version} is already published with a different tarball."
            exit 1
          fi
          npm publish "$tarball" --access public

  github-release:
    # Glama's Auto-Release rebuilds the server on every GitHub release.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/release_notes.py "$version" > release-notes.md
          files=(dist/dsh_evokit-"${version}"-py3-none-any.whl dist/dsh_evokit-"${version}".tar.gz dist/dsh-evokit-"${version}".tgz dist/SHA256SUMS)
          ls -l "${files[@]}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --draft=false --latest
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md --latest
          fi

  publish-mcp-registry:
    # The official MCP Registry checks package ownership against the PyPI long
    # description (`mcp-name:` marker), so this waits for publish-pypi and for
    # PyPI to serve the version. GitHub OIDC login grants io.github.<owner>/*.
    # The registry refuses a duplicate version, so a rerun skips a version that
    # is already listed.
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      # sha256 of mcp-publisher_linux_amd64.tar.gz in that release's checksums file.
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v4
      - name: Check that server.json names the tagged version
        run: |
          python3 -c "import json,os; s=json.load(open('server.json')); v=os.environ['GITHUB_REF_NAME'][1:]; assert s['version']==v and [p['version'] for p in s['packages']]==[v], s"
      - name: Install the pinned mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check
          tar xzf "$archive" mcp-publisher
          rm -f "$archive"
      - name: Wait until PyPI serves the version with its mcp-name marker
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          version = os.environ["GITHUB_REF_NAME"][1:]
          name = json.load(open("server.json"))["name"]
          url = f"https://pypi.org/pypi/dsh-evokit/{version}/json"
          for attempt in range(60):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      if f"mcp-name: {name}" in json.load(response)["info"]["description"]:
                          print(f"PyPI serves dsh-evokit {version} with the mcp-name marker")
                          break
                      print("PyPI description lacks the mcp-name marker")
              except Exception as error:
                  print(f"attempt {attempt + 1}: {error}")
              time.sleep(20)
          else:
              raise SystemExit(f"PyPI did not serve dsh-evokit {version} with the marker in time")
          PY
      - name: Publish server.json unless this version is already listed
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="$(python3 -c "import json; print(json.load(open('server.json'))['name'])")"
          listed="https://registry.modelcontextprotocol.io/v0.1/servers/${name/\//%2F}/versions/${version}"
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' "$listed")"
          if [ "$code" = "200" ]; then
            echo "${name} ${version} is already in the MCP Registry; skipping."
            exit 0
          fi
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
