[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dsh-evokit"
version = "0.1.8"
description = "Domain-neutral, pluggable self-evolution experiments"
readme = "README.md"
license = "MIT"
authors = [{name = "quei"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7", "mcp>=1.20,<3", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
hb = ["heavenbase==0.1.2.2; python_version < '3.14'", "fastmcp==4.0.0b1; python_version < '3.14'"]

[tool.uv]
constraint-dependencies = ["fastmcp-slim==4.0.0b1"]

[project.scripts]
evokit = "evokit.cli:main"
dsh-evokit = "evokit.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/evokit"]

[tool.hatch.build.targets.wheel.force-include]
"skills/evolve/SKILL.md" = "evokit/data/evolve.md"
"skills/onboard/SKILL.md" = "evokit/data/onboard.md"
"skills/meta/SKILL.md" = "evokit/data/meta.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.urls]
Homepage = "https://github.com/edsml-jz2321/dsh-evokit"
Repository = "https://github.com/edsml-jz2321/dsh-evokit"
Documentation = "https://github.com/edsml-jz2321/dsh-evokit#readme"
Issues = "https://github.com/edsml-jz2321/dsh-evokit/issues"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "skills", "examples", "integrations", "scripts", "market", "README.md", "CONTRIBUTING.md", "CHANGELOG.md", "LICENSE", "pyproject.toml", "uv.lock", "plugin.json", "mcp.json", "server.json"]
